<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>식품타 | 공부 타이머</title>
<style>
:root{--bg:#f2f8f3;--card:#ffffff;--tx:#183526;--sub:#64786a;--ac:#17834b;--ac2:#e3f3e8;--bd:#d5e7d9;--r:#d94343;--y:#dfa51c;--g:#1b9a5a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111d15;--card:#1b2a20;--tx:#eaf5ec;--sub:#a5b9a9;--ac:#63d58c;--ac2:#243d2c;--bd:#344b39;--r:#ff7a72;--y:#f2bf4a;--g:#63d58c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111d15;--card:#1b2a20;--tx:#eaf5ec;--sub:#a5b9a9;--ac:#63d58c;--ac2:#243d2c;--bd:#344b39;--r:#ff7a72;--y:#f2bf4a;--g:#63d58c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.5}
main{max-width:520px;margin:0 auto;padding:14px 14px 96px}
h1{font-size:1.25rem;margin:4px 0 12px;display:flex;justify-content:space-between;align-items:center}
h2{font-size:.98rem;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.sub{color:var(--sub);font-size:.8rem}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--ac);color:var(--bg);border:0;border-radius:10px;padding:10px 14px;font-weight:700}
.chip{background:var(--ac2);border:1px solid var(--bd);border-radius:20px;padding:7px 12px;margin:3px 3px 0 0;font-size:.85rem}
.chip.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;width:100%}
label{display:block;font-size:.8rem;color:var(--sub);margin:8px 0 3px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;padding:6px 0;font-size:.7rem;color:var(--sub)}
nav button b{display:block;font-size:1.3rem;font-weight:400}
nav button.on{color:var(--ac);font-weight:700}
.bar{height:14px;border-radius:8px;background:var(--ac2);overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--g);border-radius:8px;transition:width .4s}
.emo{display:flex;justify-content:space-between}
.emo button{font-size:1.9rem;background:var(--ac2);border:1px solid var(--bd);border-radius:14px;width:18%;padding:6px 0}
.big{font-size:1.8rem;font-weight:800;color:var(--ac)}
.light{display:flex;align-items:center;gap:10px;font-size:1.05rem;font-weight:700}
.dot{width:22px;height:22px;border-radius:50%}
.warn{background:#fff4e0;color:#5a4118;border:1px solid #f0d9a8;border-radius:10px;padding:8px 10px;font-size:.82rem;margin-top:8px}
@media(prefers-color-scheme:dark){.warn{background:#33291a;color:#f0dcb0;border-color:#5a4724}}
.li{display:flex;justify-content:space-between;font-size:.88rem;padding:5px 0;border-bottom:1px solid var(--bd)}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.timer-face{font-size:2.6rem;font-weight:800;letter-spacing:.02em;text-align:center;color:var(--ac);font-variant-numeric:tabular-nums}
.drink-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.drink-btn{background:var(--ac2);border:1px solid var(--bd);border-radius:13px;padding:10px;text-align:left}.drink-btn b{display:block;font-size:.92rem}.drink-btn small{color:var(--sub)}
body{background:radial-gradient(circle at 15% -10%,rgba(43,153,83,.12),transparent 55%),var(--bg)}
.card{box-shadow:0 6px 22px rgba(25,85,45,.07);border-radius:20px;transition:border-color .18s,box-shadow .18s}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid rgba(23,131,75,.35);outline-offset:2px}
button:active{transform:translateY(1px)}
.hero{background:linear-gradient(135deg,#17834b,#35a866);color:#fff;border:0}.hero .sub,.hero .big{color:#fff}
.chip{border-radius:22px}nav button{font-size:.62rem}nav button b{font-size:1.2rem}
.clk{font-size:3.4rem;text-align:center;margin:8px 0}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{background:var(--ac2);border:1px solid var(--bd);border-radius:10px;padding:5px 0;font-size:.85rem}
.day small{display:block;font-size:.58rem;color:var(--sub);min-height:.9em}
.day.td{border-color:var(--ac)}.day.dd{background:var(--r);color:#fff}.day.dd small{color:#fff}.day.sel{outline:2px solid var(--ac)}
.timer-ring{--progress:100%;width:min(72vw,260px);height:min(72vw,260px);border-radius:50%;margin:14px auto;display:grid;place-items:center;background:conic-gradient(var(--ac) var(--progress),var(--ac2) 0);position:relative}.timer-ring:before{content:'';position:absolute;inset:12px;border-radius:50%;background:var(--card)}.timer-ring>div{position:relative;text-align:center}.timer-number{font-size:clamp(2.6rem,12vw,3.6rem);font-weight:850;letter-spacing:.025em;text-align:center;font-variant-numeric:tabular-nums;color:var(--tx);line-height:1.2}.digital-timer{background:var(--ac2);border-radius:18px;padding:28px 10px;text-align:center;margin-top:10px}.digital-timer .timer-number{font-size:clamp(3rem,14vw,4.4rem);color:var(--ac)}.minimal-timer{padding:18px 4px}.minimal-timer .timer-number{font-size:clamp(3.2rem,15vw,4.8rem);letter-spacing:.08em;margin:12px 0}.timer-presets{display:flex;flex-wrap:wrap;gap:5px}.day.examrange{background:#cbeed5;border-color:#8ccda0;color:#17492b}.day.examedge{background:var(--ac);color:white;border-color:var(--ac)}.day.examedge small{color:white}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.fc{border-radius:20px;padding:16px 8px;text-align:center;color:#2a2a2a;font-weight:700}.fc b{display:block;font-size:2.8rem}.fc span{font-size:.72rem;display:block;font-weight:400}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:9}
#ov>div{background:var(--card);border-radius:24px 24px 0 0;padding:18px;width:100%;max-width:520px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.rk{display:flex;justify-content:space-between;padding:9px 10px;border-radius:12px;margin-bottom:6px;background:var(--ac2)}.rk.me{outline:2px solid var(--ac);font-weight:700}
.sosbg{background:linear-gradient(135deg,#c0392b,#e67e22);color:#fff;border:0;animation:pl 1.5s infinite}@keyframes pl{0%,100%{box-shadow:0 0 0 0 rgba(230,60,40,.5)}50%{box-shadow:0 0 18px 6px rgba(230,60,40,.45)}}
nav{overflow-x:auto}nav button{flex:0 0 auto;min-width:54px}.mon{font-size:4rem;text-align:center}details summary{cursor:pointer}
</style>
</head>
<body>
<section id="authGate" style="max-width:520px;margin:8vh auto;padding:20px;display:none">
  <div class="card hero"><h1>식품타</h1><h2>내 공부 기록을 안전하게 저장해요</h2><div class="sub">계정을 만들거나 로그인하면 시험 기간, 공부 기록, 카페인 기록을 계정에 저장할 수 있어요.</div></div>
  <div class="card">
    <div class="row"><button class="chip" id="loginMode" type="button" onclick="setAuthMode('login')">로그인</button><button class="chip" id="registerMode" type="button" onclick="setAuthMode('register')">회원가입</button></div>
    <form id="authForm" onsubmit="submitAuth(event)">
      <label>이메일</label><input id="authEmail" type="email" required maxlength="254" autocomplete="username" placeholder="you@example.com">
      <label>비밀번호</label><input id="authPassword" type="password" required minlength="8" maxlength="128" autocomplete="current-password" placeholder="8자 이상">
      <div id="authError" class="warn" style="display:none;margin-top:10px"></div>
      <button class="btn" id="authSubmit" type="submit" style="width:100%;margin-top:14px">로그인</button>
    </form>
    <div class="sub" style="margin-top:12px">개인 기록은 로그인한 계정에 연결됩니다. 다른 사람과 비밀번호를 공유하지 마세요.</div>
  </div>
</section>
<div id="appShell" style="display:none"><main id="app"></main>
<nav id="nav"></nav></div>
<script>
const TABS=[['study','⏱','공부 타이머'],['home','☕','카페인 보조'],['cal','📅','일정'],['exam','📝','시험 기간'],['fame','🏆','명예']];
const DR=[["아메리카노",130],["에너지드링크",100],["에스프레소",65],["녹차",30],["콜라",34],["캔커피",60]];
// 음식: [이름, 정제 탄수 점수(0-3), 단백질·지방·섬유 완충(0-2)]
const FD=[["삼각김밥",2,0],["초코바",3,0],["우유",1,1],["삶은 달걀",0,2],["바나나",2,1],["견과류",0,2],["요거트",1,1],["라면",3,0],["샌드위치",2,1],["단백질바",1,2],["과일주스",3,0],["두유",1,1]];
const SOS={
"더부룩":{eat:["미지근한 물 조금씩","따뜻한 매실차나 생강차","소화가 쉬운 죽"],avoid:["탄산음료","기름진 음식","급하게 먹기"],why:"차가운 음료는 위 운동을 둔하게 할 수 있고, 미지근한 수분은 위 부담을 줄여줘요."},
"속쓰림":{eat:["미지근한 물","바나나","부드러운 흰죽"],avoid:["커피·에너지드링크","맵고 신 음식","탄산"],why:"카페인과 산성 음식은 위산 분비를 자극해서 속쓰림을 키울 수 있어요."},
"설사":{eat:["물·묽은 이온음료(수분 보충)","흰죽","바나나"],avoid:["우유·유제품","카페인","찬 음식"],why:"설사 때는 수분과 전해질이 빠져나가요. 부드럽고 자극 적은 음식으로 장을 쉬게 해요."},
"변비":{eat:["물 충분히","키위","귀리·고구마"],avoid:["과자·라면 위주 식사","수분 부족"],why:"식이섬유는 물을 머금고 변 부피를 늘려서 장 운동을 도와요."},
"메스꺼움":{eat:["미지근한 물 한두 모금","크래커","생강차"],avoid:["기름진 음식","강한 냄새 음식","커피"],why:"빈속이나 기름진 음식은 메스꺼움을 키워요. 소량의 마른 탄수화물이 도움이 될 수 있어요."}};
let S={tab:"study",kg:60,bed:"23:30",hl:5.5,ageBand:'teen',profile:{complete:false,name:'',gender:'미선택',age:'',weight:60,pregnant:'no'},items:[],logs:[],focus:[],meals:[],study:[],tm:null,exp:null,sym:"더부룩",pick:[],exam:"08:40",examRange:{start:null,end:null},timerStyle:'ring',subj:['국어','수학','영어'],sel:'국어',todos:[],dd:null,chk:15,menu:'',cf:[],gw:0};
let AUTH_MODE='login', SERVER_READY=false, SERVER_SAVE_TIMER=null, SERVER_SAVE_CHAIN=Promise.resolve();
let LOCAL_STATE_BACKUP=null;
try{LOCAL_STATE_BACKUP=JSON.parse(localStorage.getItem('sst')||'null');if(LOCAL_STATE_BACKUP)Object.assign(S,LOCAL_STATE_BACKUP)}catch(e){}
if(!S.profile)S.profile={complete:false,name:'',gender:'미선택',age:'',weight:S.kg||60,pregnant:'no'};if(S.profile.gender==='남성')S.profile.pregnant='no';if(!Array.isArray(S.items))S.items=[];if(!S.profile.complete)S.profile.complete=false;
if(['food','lab','caffeine','sos','home'].includes(S.tab) && !S._visitedPrimaryStudy){S.tab='study';S._visitedPrimaryStudy=true;}if(!S.examRange)S.examRange={start:null,end:null};try{const savedRange=JSON.parse(localStorage.getItem('sst_examRange')||'null');if(savedRange&&typeof savedRange==='object')S.examRange={start:savedRange.start||null,end:savedRange.end||null}}catch(e){}if(typeof S.examRangeEditing!=='boolean')S.examRangeEditing=!(S.examRange.start&&S.examRange.end);if(!S.timerStyle)S.timerStyle='ring';
function save(){
  try{localStorage.setItem('sst',JSON.stringify(S));localStorage.setItem('sst_examRange',JSON.stringify(S.examRange||{start:null,end:null}))}catch(e){console.error('로컬 임시 저장 실패:',e)}
  if(SERVER_READY){clearTimeout(SERVER_SAVE_TIMER);SERVER_SAVE_TIMER=setTimeout(()=>persistServerState(),250)}
}
async function persistServerState(){
  clearTimeout(SERVER_SAVE_TIMER);
  const snapshot=JSON.stringify(S);
  SERVER_SAVE_CHAIN=SERVER_SAVE_CHAIN.then(async()=>{const r=await fetch('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:snapshot});if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.error||'서버 저장에 실패했어요.')}await r.json().catch(()=>({}));showSaveStatus('서버에 저장됨');return true}).catch(e=>{console.error(e);showSaveStatus('서버 저장 실패: '+e.message,true);return false});
  return SERVER_SAVE_CHAIN;
}
function showSaveStatus(message,isError=false){let el=document.getElementById('serverStatus');if(!el){el=document.createElement('div');el.id='serverStatus';el.style.cssText='position:fixed;bottom:76px;left:12px;right:12px;z-index:9999;text-align:center;padding:8px;border-radius:10px;background:var(--card);border:1px solid var(--bd);font-size:13px';document.body.appendChild(el)}el.textContent=message;el.style.color=isError?'#c0392b':'var(--tx)';if(!isError)setTimeout(()=>el.remove(),2200)}
function setAuthMode(mode){AUTH_MODE=mode;document.getElementById('authError').style.display='none';document.getElementById('authSubmit').textContent=mode==='login'?'로그인':'회원가입';document.getElementById('authPassword').autocomplete=mode==='login'?'current-password':'new-password';document.getElementById('loginMode').classList.toggle('on',mode==='login');document.getElementById('registerMode').classList.toggle('on',mode==='register')}
function showAuthError(msg){const el=document.getElementById('authError');el.textContent=msg;el.style.display='block'}
async function submitAuth(e){e.preventDefault();const email=document.getElementById('authEmail').value.trim(),password=document.getElementById('authPassword').value;const b=document.getElementById('authSubmit');b.disabled=true;b.textContent='처리 중…';try{const r=await fetch(AUTH_MODE==='login'?'/api/login':'/api/register',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({email,password})});const d=await r.json();if(!r.ok)throw new Error(d.error||'요청을 처리하지 못했어요.');await startAuthenticatedSession(d.is_new===true)}catch(err){showAuthError(err.message)}finally{b.disabled=false;b.textContent=AUTH_MODE==='login'?'로그인':'회원가입'}}
async function startAuthenticatedSession(isNew){document.getElementById('authGate').style.display='none';document.getElementById('appShell').style.display='block';try{const r=await fetch('/api/state',{credentials:'same-origin'});if(!r.ok)throw new Error('저장된 데이터를 불러오지 못했어요.');const d=await r.json();if(d.state&&typeof d.state==='object'){Object.assign(S,d.state)}else if(isNew&&LOCAL_STATE_BACKUP&&typeof LOCAL_STATE_BACKUP==='object'){Object.assign(S,LOCAL_STATE_BACKUP);SERVER_READY=true;await persistServerState()}SERVER_READY=true;if(!S.examRange)S.examRange={start:null,end:null};try{const er=JSON.parse(localStorage.getItem('sst_examRange')||'null');if(!d.state&&er)S.examRange=er}catch(e){}if(typeof S.examRangeEditing!=='boolean')S.examRangeEditing=!(S.examRange.start&&S.examRange.end);render();showSaveStatus('로그인 완료 · 서버 동기화됨')}catch(err){document.getElementById('appShell').style.display='none';document.getElementById('authGate').style.display='block';showAuthError(err.message)}}
async function boot(){document.getElementById('authGate').style.display='block';setAuthMode('login');try{const r=await fetch('/api/me',{credentials:'same-origin'});const d=await r.json();if(d.authenticated){await startAuthenticatedSession(false)}}catch(e){showAuthError('서버에 연결할 수 없어요. 잠시 후 다시 시도해 주세요.')}}
async function logout(){if(!confirm('로그아웃할까요?'))return;try{if(SERVER_READY){const saved=await persistServerState();if(!saved){alert('저장되지 않은 변경 사항이 있을 수 있어 로그아웃을 취소했어요. 다시 시도해 주세요.');return}}await fetch('/api/logout',{method:'POST',credentials:'same-origin'});SERVER_READY=false;document.getElementById('appShell').style.display='none';document.getElementById('authGate').style.display='block';setAuthMode('login')}catch(e){alert('로그아웃에 실패했어요.')}}
const $=(h)=>h;const now=()=>Date.now();
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()};
const mgNow=()=>S.logs.reduce((a,l)=>a+l.mg*Math.pow(.5,(now()-l.t)/36e5/S.hl),0);
const mgDay=()=>S.logs.filter(l=>l.t>=today()).reduce((a,l)=>a+l.mg,0);
const lim=()=>{const p=S.profile||{};if(p.pregnant==='yes')return 300;const age=Number(p.age)||0;return age>=19?400:Math.min(150,Math.round((Number(p.weight)||S.kg||60)*2.5))};
const hm=m=>{m=((Math.round(m)%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")};
const tm=v=>{const p=v.split(":");return +p[0]*60+ +p[1]};
function score(names){let c=0,b=0;names.forEach(n=>{const f=FD.find(x=>x[0]===n);c+=f[1];b+=f[2]});return Math.max(0,Math.min(3,c-b))}
const LV=[["#2e9e5b","낮음 · 오후에도 비교적 안정"],["#e9a825","보통 · 졸릴 수 있어요"],["#e5534b","높음 · 식후 졸림 주의"],["#e5534b","매우 높음 · 단 것만 먹는 조합"]];
function render(){
if(!SERVER_READY)return;
const a=document.getElementById("app"),nav=document.getElementById("nav");
if(!S.profile||!S.profile.complete){nav.style.display='none';a.innerHTML=profileForm();return}
nav.style.display='flex';nav.innerHTML=TABS.map(t=>`<button class="${S.tab===t[0]?"on":""}" onclick="go('${t[0]}')"><b>${t[1]}</b>${t[2]}</button>`).join("")+`<button onclick="logout()">로그아웃</button>`;
a.innerHTML=({home,caffeine,study,cal,exam,fame,sos})[S.tab]();
if(S.tab==='fame')loadLeaderboard();if(S.tab==='sos'&&SS&&SS.st===3)sosR()}
function go(t){S.tab=t;save();render();window.scrollTo(0,0)}
function home(){return caffeine()}

function myScore(){let h=0,m=0;for(let i=0;i<7;i++){h+=dayStat(i);const d0=today()-i*864e5;m+=S.study.filter(s=>s.t>=d0&&s.t<d0+864e5).reduce((a,s)=>a+s.m,0)}return{h:h+Math.min(30,S.gw*3),s:Math.min(120,Math.round(m/5))}}

async function loadLeaderboard(){
  const list=document.getElementById('leaderboardList');
  if(!list)return;

  try{
    const r=await fetch('/api/leaderboard',{credentials:'same-origin'});
    if(!r.ok)throw new Error('순위를 불러오지 못했어요.');

    const d=await r.json();
    const rows=d.rankings||[];
    const me=rows.find(x=>x.is_me);
    const first=rows[0];

    list.innerHTML=rows.length?rows.map((x,i)=>
      `<div class="rk ${x.is_me?'me':''}">
        <span>${i+1}. ${escapeHTML(x.name)}${x.is_me?' (나)':''}</span>
        <span>${x.score}점</span>
      </div>`
    ).join(''):'아직 순위 데이터가 없어요.';

    const msg=document.getElementById('leaderboardMessage');
    if(msg){
      msg.textContent=me&&first
        ?(first.is_me?'지금 내가 1등이에요!':`1등과 ${Math.max(0,first.score-me.score)}점 차이예요.`)
        :'아직 점수 데이터가 없어요.';
    }
  }catch(e){
    list.textContent='순위를 불러오지 못했어요. 서버 배포 상태를 확인해 주세요.';
  }
}


FD.push(...S.cf.map(c=>[c.n,c.carb,c.buf]));
let CFR='',G=null,SS=null;
const SYS='너는 식품공학을 아는 고등학생용 식단 코치야. 아래 음식을 평가해줘. 형식: 1) 추정 성분 한 줄 2) 식품공학 관점 평가(전분 구조와 가공, 단백질·지방·식이섬유 완충, 카페인, 보관 안전 중 해당되는 것) 3) 공부할 때 개선 팁 1~2개 4) 5점 만점 점수. 혈당과 졸림을 직접 예측할 수 없고 추정이라는 점을 한 줄로 밝혀. 의학 진단은 하지 마. 8줄 이내 한국어로.';
function lvl(g,fb,p,f){const x=g-2*fb-.5*p-.3*f;return x<=5?0:x<=15?1:x<=30?2:3}
function addCF(){const v=i=>+document.getElementById(i).value||0,n=document.getElementById('cn').value.trim();if(!n)return;
const g=v('cg2'),fb=v('cf2'),p=v('cp'),f=v('cfat'),mg=v('cm');
const carb=g>=20?3:g>=10?2:g>=4?1:0,buf=(fb>=3?1:0)+(p>=8?1:0);
if(!FD.find(x=>x[0]===n)){FD.push([n,carb,buf]);S.cf.push({n,carb,buf})}
S.meals.push({n,it:[n],t:now()});if(mg)S.logs.push({n,mg,t:now()});save();
CFR=n+': '+LV[lvl(g,fb,p,f)][1]+' (당류 '+g+'g, 식이섬유 '+fb+'g, 단백질 '+p+'g, 지방 '+f+'g)';render()}
async function aiRun(p,blob){const o=document.getElementById('aiOut');o.textContent='평가 중…';
try{const sm=typeof claude!=='undefined'?await claude.use('sample'):null;
if(!sm){o.textContent='이 화면에서는 AI 평가를 쓸 수 없어요. 채팅창에 음식 사진이나 이름을 보내면 바로 평가해줄게요.';return}
const op={onText:r=>{o.textContent=r.text},cache:false};
if(blob){const l=await sm.limits();if(!l||!l.images){o.textContent='이 환경에서는 사진 평가가 막혀 있어요. 채팅창에 사진을 보내주세요.';return}op.images=[blob]}
const r=await sm(p,op);o.textContent=r.text}catch(e){o.textContent='평가 실패: '+((e&&(e.message||e.code))||'')}}
function aiText(){const g=id=>document.getElementById(id).value,n=g('cn').trim();if(!n)return;aiRun(SYS+'\n음식: '+n+'\n당류 '+g('cg2')+'g, 식이섬유 '+g('cf2')+'g, 단백질 '+g('cp')+'g, 지방 '+g('cfat')+'g, 카페인 '+g('cm')+'mg (빈칸은 모름)')}
function aiPhoto(el){if(el.files[0])aiRun(SYS+'\n사진 속 음식을 평가해줘. 양과 성분은 추정이라고 밝혀.',el.files[0])}
function customCard(){const I=(id,ph)=>`<input id='${id}' type='number' inputmode='decimal' placeholder='${ph}'>`;

const SC=[['🍚','같은 밥, 다른 반응','전분은 아밀로스·아밀로펙틴 비율, 호화 정도, 입자 크기에 따라 소화 속도가 달라져요. 곱게 갈고 많이 익힐수록 빠르게 소화되는 경향이 있어요.'],['🥚','같이 먹으면 달라져요','단백질과 지방, 식이섬유를 곁들이면 위 배출이 늦어지고 식후 혈당 상승이 줄어드는 경향이 실험에서 보고됐어요. 대부분 성인 대상이에요.'],['☕','카페인은 제품 편차가 커요','커피와 에너지음료는 흡수가 비슷하지만 껌은 구강 점막으로 더 빨라요. 반감기는 약 2~12시간으로 개인차가 크고, 제품별 함량 편차가 더 커서 표시 확인이 중요해요.'],['🍙','수분활성도와 보관','미생물이 쓸 수 있는 자유수가 많을수록 번식하기 쉬워요. 식약처는 김밥과 도시락을 조리 후 3시간 이내에 먹으라고 안내해요.'],['⚠️','한계','혈당 지수와 인지 능력 사이에는 일관된 효과가 확인되지 않았어요. 이 앱의 점수는 식품 구조에 대한 가정이지 졸림 예측이 아니에요.']];
const pick3=()=>[...FD].sort(()=>Math.random()-.5).slice(0,3);

function gPick(i){const f=G.hand[i],d=15+f[2]*10-f[1]*8;G.hp-=d;G.t++;
G.log=f[0]+': '+(d>0?d+' 피해!':(-d)+' 회복…')+' '+(f[1]>=2&&f[2]==0?'정제 탄수 위주라 소화가 빠를 수 있어요.':f[2]>0?'완충 요소가 있어요.':'');

function gameCard(){if(!G)return `<div class='card'><h2>🎮 졸음 몬스터 배틀</h2><div class='sub'>점심 후 나타난 졸음 몬스터! 음식 카드를 골라 4턴 안에 쓰러뜨려요. 단백질과 식이섬유 같은 완충 요소가 있으면 큰 피해, 정제 탄수만 많으면 몬스터가 회복해요. (승리 ${S.gw}회, 명예 점수 +3씩)</div><button class='btn' style='margin-top:8px' onclick='gStart()'>도전!</button></div>`;

if(st===1)return `<h1>🆘 컨디션 체크</h1>${top}<div class='card'><h2>불편함의 정도는 어느 정도인가요?</h2><div class='big' id='pl0' style='text-align:center'>${SS.p0}/10</div><input aria-label='현재 불편함 정도 0부터 10' type='range' min='0' max='10' value='${SS.p0}' oninput='sp(0,this.value)'><div class='between sub'><span>0 · 거의 없음</span><span>10 · 매우 심함</span></div><div class='row' style='margin-top:12px'><button class='chip' onclick='sosStep(0)'>이전</button><button class='btn' onclick='sosStep(2)'>다음 단계</button></div></div>`;
